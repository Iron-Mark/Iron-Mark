[project]
name = "iron-mark-profile-mcp"
version = "1.0.0"
description = "MCP server for Mark Siazon GitHub profile index (Iron-Mark/Iron-Mark)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See LICENSE.md in repo root" }
authors = [{ name = "Mark Siazon", email = "marksiazon.dev@gmail.com" }]
dependencies = [
  # Upper bound is deliberate: mcp 2.0.0 (2026-07-28) removed the bundled
  # mcp.server.fastmcp module this server builds on, so an unpinned
  # ">=1.0" started resolving to a release that cannot import. Keep the 1.x
  # line until server.py is migrated to the 2.x API.
  "mcp>=1.0,<2",
]

[project.scripts]
iron-mark-profile-mcp = "iron_mark_profile.server:main"

[project.urls]
Repository = "https://github.com/Iron-Mark/Iron-Mark"
Homepage = "https://www.marksiazon.dev"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["iron_mark_profile*"]
