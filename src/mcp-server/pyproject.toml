[project]
name = "iron-mark-profile-mcp"
version = "1.0.0"
description = "MCP server for Mark Siazon GitHub profile index (Iron-Mark/Iron-Mark)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "See LICENSE.md in repo root" }
authors = [{ name = "Mark Siazon", email = "marksiazon.dev@gmail.com" }]
dependencies = [
  # server.py builds on mcp.server.MCPServer, the high-level API that replaced
  # mcp.server.fastmcp.FastMCP when it was removed in mcp 2.0.0 (2026-07-28).
  # It does not exist on the 1.x line, hence the lower bound. The upper bound is
  # deliberate: pin out the next major so a repeat of that removal cannot break
  # CI on an unpinned resolve.
  "mcp>=2.0,<3",
]

[project.scripts]
iron-mark-profile-mcp = "iron_mark_profile.server:main"

[project.urls]
Repository = "https://github.com/Iron-Mark/Iron-Mark"
Homepage = "https://www.marksiazon.dev"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["iron_mark_profile*"]
