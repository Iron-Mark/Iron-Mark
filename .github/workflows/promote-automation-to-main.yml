name: Promote automation to main

# The rendered GitHub profile is main's README, and it references the stat
# cards with RELATIVE paths - so visitors always see MAIN's copies. The two
# daily crons only ever merge into dev, which left the profile showing stale
# numbers until someone opened a "Sync Dev" PR by hand. This workflow closes
# that gap, but ONLY for content the automation itself owns. If dev carries any
# human change the wholesale promotion steps aside and leaves it to review -
# and the four stat cards are then promoted on their own, so review-in-progress
# on dev never freezes the numbers the profile displays.
#
# NOTE: GitHub Actions always runs a *scheduled* event's workflow YAML from
# the repository's default branch (main), even though the job below checks
# out `ref: dev`. The decision logic therefore lives in
# src/scripts/check_promotion_scope.py so it evolves on dev alongside the
# workflows whose `git add` lines it mirrors (same rationale as the note in
# bump-index-date.yml).
on:
  schedule:
    # The daily crons are nominally 06:00 and 06:30 UTC, but GitHub delays
    # scheduled runs under load - observed starts range from 07:45 to 10:26
    # UTC. Run well clear of that window so a promotion never races a
    # half-finished freshness cycle.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

# Manual dispatches can overlap the daily schedule. Both runs inspect dev and
# operate on the same promotion PRs, so serialize them without cancelling the
# earlier run midway through a merge.
concurrency:
  group: promote-automation-to-main
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FAILURE_ISSUE_TITLE: "Daily automation failure: Promote automation to main"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: dev
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Decide whether dev can be promoted unattended
        id: scope
        run: |
          git fetch origin main dev --quiet
          changed=$(git diff --name-only origin/main...origin/dev)
          if [ -z "$changed" ]; then
            echo "main is already current with dev; nothing to promote."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Changed paths on dev:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if verdict=$(printf '%s\n' "$changed" | python3 src/scripts/check_promotion_scope.py); then
            echo "$verdict"
            echo "promote=true" >> "$GITHUB_OUTPUT"
          else
            echo "$verdict"
            echo "::notice::dev carries human-owned changes; leaving the dev -> main promotion to manual review."
            echo "promote=false" >> "$GITHUB_OUTPUT"
            # A skip must never be silent: an unnoticed skip is precisely how
            # the rendered profile drifted stale before this workflow existed.
            {
              echo "## Full promotion skipped"
              echo
              echo "dev was **not** promoted wholesale because it carries changes the daily"
              echo "automation does not own; those wait for a \`Sync Dev\` review. The"
              echo "profile stat cards are still promoted on their own by the next step, so"
              echo "the rendered profile stays current either way."
              echo
              echo '```'
              echo "$verdict"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Open and merge the promotion PR
        if: steps.scope.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::STATS_TOKEN not set; dev cannot be promoted unattended. Leaving it for a manual Sync Dev."
            exit 1
          fi
          title="Sync Dev"
          body="Automated promotion: dev contains only automation-owned refreshes (stat cards and freshness data), so main is being brought level to keep the rendered profile current."

          pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head dev --title "$title" --body "$body"
            pr=$(gh pr list --base main --head dev --state open --json number --jq '.[0].number')
          fi
          if [ -z "$pr" ]; then
            echo "::error::Could not find or open a dev -> main promotion PR."
            exit 1
          fi
          # The PR is opened with STATS_TOKEN (a PAT), so its required checks
          # DO run - they just have not reported yet in the seconds after
          # creation. A required check still in "expected" state cannot be
          # bypassed even by an admin merge under enforce_admins, which is
          # exactly how the first scheduled run of this workflow failed
          # (run 30457415756: 'Required status check "enforce-pr-flow" is
          # expected'). So: wait for the required checks to finish, then
          # merge. --admin stays, because it is still needed to bypass the
          # strict "branch up to date" rule (dev is perpetually behind main
          # by promotion merge commits).
          checks_done=false
          for _ in $(seq 1 30); do
            buckets=$(gh pr checks "$pr" --required --json bucket --jq '[.[].bucket] | unique | join(",")' 2>/dev/null || true)
            case "$buckets" in
              "")
                # Checks have not registered yet; keep waiting.
                ;;
              *fail*|*cancel*)
                echo "::error::A required check failed on promotion PR #$pr ($buckets); leaving it for manual review."
                exit 1
                ;;
              *pending*)
                ;;
              *)
                checks_done=true
                break
                ;;
            esac
            sleep 10
          done
          if [ "$checks_done" != "true" ]; then
            echo "::error::Required checks on promotion PR #$pr did not finish within 5 minutes; leaving it for manual merge."
            exit 1
          fi
          # The wait above can pass early on a dev->main PR: its head commit is
          # dev's tip, whose check runs from the earlier dev-side PR are green,
          # and gh pr checks reads that commit-level rollup while branch
          # protection still counts THIS PR's fresh runs as "expected" (run
          # 30546875285 failed exactly so, 4s after PR creation). The merge is
          # the only authoritative probe - retry it while GitHub still reports
          # expected/pending required checks.
          merged=false
          for _ in $(seq 1 40); do
            if out=$(gh pr merge "$pr" --merge --admin --delete-branch=false 2>&1); then
              merged=true
              break
            fi
            case "$out" in
              *"is expected"*|*"required status check"*|*"Required status check"*)
                sleep 20
                ;;
              *)
                echo "::error::Auto-promotion of PR #$pr failed: ${out}"
                exit 1
                ;;
            esac
          done
          if [ "$merged" = "true" ]; then
            echo "Promoted dev to main via PR #$pr."
          else
            echo "::error::Auto-promotion of PR #$pr still blocked by unreported checks after 13 minutes; leaving it for manual merge."
            exit 1
          fi

      - name: Promote the profile cards on their own when a full promotion is blocked
        if: steps.scope.outputs.promote != 'true'
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          # The rendered profile reads main's cards, so human work parked on dev
          # would otherwise freeze the visible numbers for as long as it sits
          # there. The four cards are self-contained, so they can cross to main
          # by themselves; everything else still waits for review.
          cards=$(python3 src/scripts/check_promotion_scope.py --print-cards)
          git fetch origin main dev --quiet
          if git diff --quiet origin/main origin/dev -- $cards; then
            echo "Profile cards on main already match dev; nothing to promote."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::STATS_TOKEN not set; the profile cards cannot be promoted."
            exit 1
          fi

          branch="automation/promote-profile-cards"
          title="chore: refresh profile stat cards"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build the branch from main and take ONLY the card blobs from dev, so
          # nothing else on dev can ride along into the default branch.
          git checkout -q -B "$branch" origin/main
          git checkout origin/dev -- $cards
          git add $cards
          if git diff --staged --quiet; then
            echo "No card changes to commit; nothing to promote."
            exit 0
          fi
          git commit -q -m "$title"
          # Bot-owned branch, recreated each run; nothing else writes to it.
          # Push with the PAT, blanking the checkout-persisted extraheader that
          # would otherwise outrank the URL credential and attribute the push
          # to github-actions[bot] (whose synchronize checks stall awaiting
          # approval). Same pattern as update-github-stats.yml.
          git -c http.https://github.com/.extraheader= push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

          pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            gh pr create --base main --head "$branch" --title "$title"               --body "Promotes only the generated profile stat cards from dev. A full \`Sync Dev\` promotion is blocked by changes awaiting review, and the rendered profile reads main, so the cards cross on their own to keep the displayed numbers current."
            pr=$(gh pr list --base main --head "$branch" --state open --json number --jq '.[0].number')
          fi
          if [ -z "$pr" ]; then
            echo "::error::Could not find or open the profile card promotion PR."
            exit 1
          fi
          # Same wait as the full-promotion step above (and the same reason:
          # an admin merge cannot bypass a required check still in "expected"
          # state - dispatch run 30509020013 failed exactly there).
          checks_done=false
          for _ in $(seq 1 30); do
            buckets=$(gh pr checks "$pr" --required --json bucket --jq '[.[].bucket] | unique | join(",")' 2>/dev/null || true)
            case "$buckets" in
              "")
                ;;
              *fail*|*cancel*)
                echo "::error::A required check failed on card promotion PR #$pr ($buckets); leaving it for manual review."
                exit 1
                ;;
              *pending*)
                ;;
              *)
                checks_done=true
                break
                ;;
            esac
            sleep 10
          done
          if [ "$checks_done" != "true" ]; then
            echo "::error::Required checks on card promotion PR #$pr did not finish within 5 minutes; leaving it for manual merge."
            exit 1
          fi
          if gh pr merge "$pr" --merge --admin --delete-branch=false; then
            echo "Promoted the profile cards to main via PR #$pr."
            { echo "## Profile cards promoted"; echo; echo "Merged PR #$pr with the refreshed stat cards only."; } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Card promotion PR #$pr could not be merged; the profile will stay stale until it is."
            exit 1
          fi

      - name: Ensure the dev branch survived the merge
        if: steps.scope.outputs.promote == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/branches/dev" --jq .name > /dev/null 2>&1; then
            echo "dev branch intact."
            exit 0
          fi
          # This repo has auto-deleted dev on promotion merges before; recreate
          # it at main's tip so the next daily cycle still has somewhere to land.
          main_sha=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          gh api "repos/${{ github.repository }}/git/refs" -f ref=refs/heads/dev -f sha="$main_sha" > /dev/null
          echo "::warning::dev was deleted by the merge and has been recreated at $main_sha."

      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The **Promote automation to main** workflow has recovered successfully.\n\nSuccessful run: %s\n\nClosing this reusable failure alert.' "$run_url")

          existing=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$FAILURE_ISSUE_TITLE\"" --state open --json number --jq '.[0].number' 2>/dev/null)
          listed=$?
          if [ "$listed" != "0" ]; then
            echo "::warning::Could not check for a recovered failure issue (Issues may be disabled for this repository)."
          elif [ -n "$existing" ] && [[ "$existing" =~ ^[0-9]+$ ]]; then
            if gh issue close "$existing" --repo "${{ github.repository }}" --reason completed --comment "$body"; then
              echo "Closed recovered failure issue #$existing."
            else
              echo "::warning::Could not close recovered failure issue #$existing."
            fi
          else
            echo "No open failure issue to close."
          fi
          exit 0

      - name: Alert on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          title="$FAILURE_ISSUE_TITLE"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The **Promote automation to main** workflow failed, so the rendered profile may be showing stale cards.\n\nRun: %s\n\nThis issue is reused across failures until the workflow succeeds again.' "$run_url")

          existing=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$title\"" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$existing" ] && [[ "$existing" =~ ^[0-9]+$ ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
            alerted=$?
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
            alerted=$?
          fi

          # gh issue calls fail outright if Issues are disabled for the repo.
          # Never let the alert step itself add a confusing second failure -
          # fall back to a job summary entry so the failure is still visible.
          if [ "${alerted:-1}" != "0" ]; then
            echo "::warning::Could not post a GitHub Issue alert (Issues may be disabled for this repository); see the job summary instead."
            { echo "## $title"; echo; echo "$body"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
