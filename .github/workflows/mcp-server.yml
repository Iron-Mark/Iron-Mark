name: MCP server e2e

on:
  pull_request:
    paths:
      - "src/mcp-server/**"
      - "llms-index.json"
      - "public/**"
      - "src/scripts/test_mcp_server.py"
      - "src/scripts/test_mcp_http.py"
  push:
    branches: [main, dev]
    paths:
      - "src/mcp-server/**"
      - "src/scripts/test_mcp_*.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install MCP server
        run: pip install -e src/mcp-server/

      - name: E2E smoke test (stdio)
        run: python3 src/scripts/test_mcp_server.py

      - name: E2E smoke test (streamable HTTP)
        run: python3 src/scripts/test_mcp_http.py
