name: Deploy GitHub Pages mirror

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'public/**'
      - 'assets/**'
      - 'llms*.json'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'humans.txt'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Generate derived files
        run: |
          python3 src/scripts/generate_llms_ctx.py
          python3 src/scripts/generate_schema.py
          python3 src/scripts/build_pages_index.py
          python3 src/scripts/generate_sitemap.py
          python3 src/scripts/generate_portfolio_sync.py

      - name: Validate source metadata
        run: python3 src/scripts/validate_index.py

      - name: Build docs mirror
        run: |
          mkdir -p docs
          for f in llms.txt llms-index.json humans.txt robots.txt sitemap.xml; do
            cp "$f" "docs/$f"
          done
          for f in README.md FAQ.md RECRUITER.md PROOF.md LAB.md PROFILE.md STACK.md HOW-TO-CITE.md LICENSE.md CITATION.cff llms-full.txt llms-ctx-full.txt; do
            cp "public/$f" "docs/$f"
          done
          rm -rf docs/assets
          cp -r assets docs/
          rm -rf docs/schema
          cp -r public/schema docs/
          python3 src/scripts/build_pages_mirror.py

      - name: Validate docs mirror
        run: python3 src/scripts/validate_pages_mirror.py

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
