name: Bump index dates

# NOTE: GitHub Actions always runs a *scheduled* (and workflow_dispatch)
# event's workflow YAML from the repository's default branch (main), even
# though the `bump` job below explicitly checks out `ref: dev` for
# everything else. That means this YAML file is always main's copy on a
# schedule - only the checked-out scripts (src/scripts/*.py) reflect dev.
# The pipeline body (derive -> bump dates -> regenerate -> validate) is
# consolidated into src/scripts/daily_freshness.py for exactly this reason:
# so the pipeline's actual shape lives on dev with the scripts it drives,
# and this file only needs to invoke it as a single step.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bump-index-date.yml"
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

# A schedule, manual dispatch, and workflow-file push can land close together.
# Every run force-pushes the same automation branch, so queue them rather than
# letting one run replace another run's head while its PR is being merged.
concurrency:
  group: bump-index-dates
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      FAILURE_ISSUE_TITLE: "Daily automation failure: Bump index dates"
    steps:
      - uses: actions/checkout@v5
        with:
          # The daily schedule runs on main (default branch), but the freshness PR
          # targets dev. Build the bot branch FROM dev so it can never conflict
          # with it (same fix as update-github-stats.yml).
          ref: dev

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run daily freshness pipeline (derive, bump dates, regenerate, validate)
        run: python3 src/scripts/daily_freshness.py

      - name: Open freshness PR if changed
        env:
          # MUST be the PAT, not github.token: GitHub never fires pull_request
          # events for PRs created (or heads pushed) by GITHUB_TOKEN, so the
          # required checks would not exist and the wait-then-merge step below
          # would time out. With the PAT, checks run for real.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || github.token }}
        run: |
          branch="automation/bump-index-freshness"
          title="chore: bump index freshness dates"
          body="Automated freshness update from the Bump index dates workflow."

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms-index.json robots.txt sitemap.xml public/FAQ.md public/PROOF.md public/RECRUITER.md src/data/portfolio-feed.snapshot.json public/llms-full.txt public/llms-ctx-full.txt public/schema/llms-index.schema.json public/schema/person.jsonld public/schema/faq.jsonld docs/index.html src/portfolio-sync/marksiazon-dev-llms-snippet.md src/portfolio-sync/faq-crosslinks.md
          git diff --staged --quiet && echo "No date changes" && exit 0
          git switch -c "$branch"
          git commit -m "$title"
          # Recreate the bot-owned branch each run. actions/checkout only fetches the
          # triggering branch, so there's no remote-tracking ref and --force-with-lease
          # rejects with "stale info"; a plain force is safe for this automation branch.
          # Push with the PAT too: a synchronize caused by a GITHUB_TOKEN push
          # would not re-fire checks on a reused PR. The -c is load-bearing:
          # actions/checkout persists github.token as an http.extraheader that
          # silently outranks the URL credential, attributing the push to
          # github-actions[bot] and landing its PR checks in the awaiting-approval
          # state (same pattern as update-github-stats.yml).
          git -c http.https://github.com/.extraheader= push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"

          open_pr=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$open_pr" ]; then
            gh pr edit "$open_pr" --title "$title" --body "$body"
          else
            # Target dev: enforce-pr-flow rejects PRs into main that don't come from
            # dev, so freshness updates flow dev -> main via the normal promotion.
            gh pr create --base dev --head "$branch" --title "$title" --body "$body"
          fi

      - name: Auto-merge the freshness PR into dev
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: |
          branch="automation/bump-index-freshness"
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::STATS_TOKEN not set; the freshness PR was opened but cannot be auto-merged. Leaving it for manual merge."
            exit 1
          fi
          pr=$(gh pr list --head "$branch" --base dev --state open --json number --jq '.[0].number')
          if [ -z "$pr" ]; then
            echo "No open PR to merge."
            exit 0
          fi
          # The PR is opened with STATS_TOKEN (a PAT), so its required checks DO
          # run - they just have not reported yet seconds after creation, and a
          # required check still in "expected" state cannot be bypassed even by
          # an admin merge under enforce_admins. Same race and fix as
          # update-github-stats.yml (kept in sync by hand - if you edit
          # one wait loop, edit the other).
          checks_done=false
          for _ in $(seq 1 30); do
            buckets=$(gh pr checks "$pr" --required --json bucket --jq '[.[].bucket] | unique | join(",")' 2>/dev/null || true)
            case "$buckets" in
              "")
                ;;
              *fail*|*cancel*)
                echo "::error::A required check failed on freshness PR #$pr ($buckets); leaving it for manual review."
                exit 1
                ;;
              *pending*)
                ;;
              *)
                checks_done=true
                break
                ;;
            esac
            sleep 10
          done
          if [ "$checks_done" != "true" ]; then
            echo "::error::Required checks on freshness PR #$pr did not finish within 5 minutes; leaving it for manual merge."
            exit 1
          fi
          # --admin stays: it bypasses the strict "branch up to date" rule.
          if gh pr merge "$pr" --merge --admin; then
            echo "Merged PR #$pr into dev."
          else
            echo "::error::Auto-merge of PR #$pr failed; leaving it for manual merge (STATS_TOKEN may need repo/public_repo scope)."
            exit 1
          fi

      - name: Close recovered failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The **Bump index dates** workflow has recovered successfully.\n\nSuccessful run: %s\n\nClosing this reusable failure alert.' "$run_url")

          existing=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$FAILURE_ISSUE_TITLE\"" --state open --json number --jq '.[0].number' 2>/dev/null)
          listed=$?
          if [ "$listed" != "0" ]; then
            echo "::warning::Could not check for a recovered failure issue (Issues may be disabled for this repository)."
          elif [ -n "$existing" ] && [[ "$existing" =~ ^[0-9]+$ ]]; then
            if gh issue close "$existing" --repo "${{ github.repository }}" --reason completed --comment "$body"; then
              echo "Closed recovered failure issue #$existing."
            else
              echo "::warning::Could not close recovered failure issue #$existing."
            fi
          else
            echo "No open failure issue to close."
          fi
          exit 0

      - name: Alert on workflow failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          title="$FAILURE_ISSUE_TITLE"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          body=$(printf 'The **Bump index dates** workflow failed.\n\nRun: %s\n\nThis issue is reused across failures until the workflow succeeds again.' "$run_url")

          existing=$(gh issue list --repo "${{ github.repository }}" --search "in:title \"$title\"" --state open --json number --jq '.[0].number' 2>/dev/null)
          if [ -n "$existing" ] && [[ "$existing" =~ ^[0-9]+$ ]]; then
            gh issue comment "$existing" --repo "${{ github.repository }}" --body "$body"
            alerted=$?
          else
            gh issue create --repo "${{ github.repository }}" --title "$title" --body "$body"
            alerted=$?
          fi

          # gh issue calls fail outright if Issues are disabled for the repo.
          # Never let the alert step itself add a confusing second failure -
          # fall back to a job summary entry so the failure is still visible.
          if [ "${alerted:-1}" != "0" ]; then
            echo "::warning::Could not post a GitHub Issue alert (Issues may be disabled for this repository); see the job summary instead."
            { echo "## $title"; echo; echo "$body"; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit 0
