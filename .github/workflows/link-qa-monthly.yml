name: Link QA (monthly)

on:
  schedule:
    - cron: "0 8 1 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: link-qa-monthly
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      exit_code: ${{ steps.qa.outputs.exit_code }}
      report_b64: ${{ steps.qa.outputs.report_b64 }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Run link QA
        id: qa
        shell: bash
        run: |
          set +e
          python3 src/scripts/link_qa.py 2>&1 | tee link-qa-output.txt
          status=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          echo "report_b64=$(base64 -w 0 link-qa-output.txt)" >> "$GITHUB_OUTPUT"

      - name: Check portfolio mirror
        run: python3 src/scripts/check_portfolio_mirror.py
        continue-on-error: true

  manage-issue:
    needs: check
    if: always() && needs.check.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      CHECK_EXIT: ${{ needs.check.outputs.exit_code }}
      REPORT_B64: ${{ needs.check.outputs.report_b64 }}
      ISSUE_TITLE: Link QA failures
    steps:
      - name: Reuse, close, or create the Link QA issue
        shell: bash
        run: |
          set -euo pipefail

          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          issue_number="$(
            gh issue list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --limit 100 \
              --json number,title \
              --jq '[.[] | select(.title == "Link QA failures" or (.title | startswith("Link QA failed:")))] | sort_by(.number) | .[0].number // empty'
          )"

          if [[ "$CHECK_EXIT" == "0" ]]; then
            if [[ -n "$issue_number" ]]; then
              gh issue edit "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE"
              gh issue close "$issue_number" \
                --repo "$GITHUB_REPOSITORY" \
                --reason completed \
                --comment "Link QA recovered successfully. Clean run: $run_url"
            else
              echo "Link QA is clean; no open recovery issue exists."
            fi
            exit 0
          fi

          if ! printf '%s' "$REPORT_B64" | base64 --decode > link-qa-output.txt; then
            printf '%s\n' "Link QA did not produce a readable report." > link-qa-output.txt
          fi

          if [[ "$CHECK_EXIT" == "1" ]]; then
            summary="Monthly link QA found broken URLs or local links."
          else
            summary="Monthly link QA could not complete (exit code: ${CHECK_EXIT:-missing})."
          fi

          {
            printf '%s\n\n' "$summary"
            printf 'Latest failed run: %s\n\n' "$run_url"
            printf '%s\n' '```text'
            head -n 80 link-qa-output.txt
            printf '%s\n\n' '```'
            printf '%s\n' 'Run locally: `python3 src/scripts/link_qa.py`'
          } > issue-body.md

          if [[ -n "$issue_number" ]]; then
            gh issue edit "$issue_number" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ISSUE_TITLE" \
              --body-file issue-body.md
            echo "Updated issue #$issue_number."
          else
            issue_url="$(
              gh issue create \
                --repo "$GITHUB_REPOSITORY" \
                --title "$ISSUE_TITLE" \
                --body-file issue-body.md
            )"
            echo "Created $issue_url."
          fi

          exit 1
